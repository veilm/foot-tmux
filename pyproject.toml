[tool.pyright]
strict = ['tools']

[tool.mypy]
files = '$MYPY_CONFIG_FILE_DIR/tools'
strict = true

[tool.codespell]
skip = 'pyproject.toml,./subprojects,./pkg,./src,./bld,./data/terminfo/foot.info,./data/unicode,./venv'
ignore-regex = 'terminfo capability `rin`|\* Simon Ser|\* \[zar\]\(https://codeberg.org/zar\)|iterm theme|iterm.toml|iterm/OneHalfDark.itermcolors'
