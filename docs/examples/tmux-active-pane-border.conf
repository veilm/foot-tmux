# Isolated test config for foot-tmux active pane border reporting.
#
# Run with:
#   tmux -L foot-tmux-test -f /home/light/src/foot-tmux/docs/examples/tmux-active-pane-border.conf new-session -A -s foot-border-test

set -g pane-border-lines double
set -g pane-border-style fg=colour8
set -g pane-active-border-style fg=colour1
set -g status on
set -g status-position bottom
set -g status-style bg=default,fg=colour7
set -g status-left '#[fg=colour1] foot-tmux test #[default]'
set -g status-right '#[fg=colour3]#{pane_id} #{pane_width}x#{pane_height} @ #{pane_left},#{pane_top} #[default]'

set -g @foot_tmux_pane_report '/home/light/src/foot-tmux/tools/foot-tmux-pane-report'

set-hook -g client-attached        'run-shell -b "sh #{@foot_tmux_pane_report} #{client_tty}"'
set-hook -g client-resized         'run-shell -b "sh #{@foot_tmux_pane_report} #{client_tty}"'
set-hook -g window-resized         'run-shell -b "sh #{@foot_tmux_pane_report}"'
set-hook -g window-layout-changed  'run-shell -b "sh #{@foot_tmux_pane_report}"'
set-hook -g window-pane-changed    'run-shell -b "sh #{@foot_tmux_pane_report}"'
set-hook -g session-window-changed 'run-shell -b "sh #{@foot_tmux_pane_report}"'

bind-key r run-shell -b "sh #{@foot_tmux_pane_report} #{client_tty}" \; display-message "resent foot-tmux pane geometry"
bind-key C-r run-shell -b "sh #{@foot_tmux_pane_report} clear #{client_tty}" \; display-message "cleared foot-tmux pane geometry"

run-shell -b "sh #{@foot_tmux_pane_report}"
